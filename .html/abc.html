<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Heading range from 1 to 6</h1>
    <h2 style="color: red; text-align: center; background-color:aqua;">kodnest</h2>
    <h3>kodnest</h3>
    <h4>kodnest</h4>
    <h5>kodnest</h5>
    <h6>kodnest</h6>
    <p contenteditable="true">this is a paragraph</p>
    <p>my name
        <!-- single space -->
        ranjana
    </p>
    <!-- pre formatted text -->
     <!-- multiple spaces available -->
     <pre>
        my name
           ranjana
     </pre>
     
</body>
</html>
